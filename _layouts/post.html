<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8">
  <title>{{ page.title | strip_html }} - {{ site.title }}</title>
  <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}">
</head>

<body>
  <div class="contentContainer postContent">
    <h1>{{ page.title }}</h1>
    <a class="editLink" href="https://github.com/drewdaemon/drewtate.io/edit/main/{{ page.path }}">✏</a>
    {{ content }}
  </div>
</body>

</html>
